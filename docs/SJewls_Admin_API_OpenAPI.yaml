openapi: 3.0.1
info:
  title: SJewls Admin & Staff Portal API
  description: "API endpoints for the SJewls Admin Web Portal \u2014 Staff Authentication,\
    \ Password Recovery, Staff User Management, Customer Management with Full Unmasked\
    \ NIC, and Branch Statistics."
  version: v1
servers:
- url: http://localhost:5230
  description: Current Host
- url: http://localhost:5230
  description: Local Server
paths:
  /api/v1/admin/auth/login:
    post:
      tags:
      - Admin Auth
      summary: Staff and Super Admin Login
      description: Authenticates a staff member or Super Admin using their username/email
        and password. Returns a JWT bearer token and user profile.
      operationId: AdminLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLoginResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /api/v1/admin/auth/logout:
    post:
      tags:
      - Admin Auth
      summary: Staff Logout
      description: Invalidates current staff sessions by updating security stamp and
        logs the logout event.
      operationId: AdminLogout
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffLogoutResponse'
        '401':
          description: Unauthorized
  /api/v1/admin/auth/me:
    get:
      tags:
      - Admin Auth
      summary: Get Current Staff Profile
      description: Retrieves the authenticated staff member's profile, roles, and
        branch assignments. Enforces active status and security stamp validity.
      operationId: AdminGetMe
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserDto'
        '401':
          description: Unauthorized
  /api/v1/admin/auth/forgot-password:
    post:
      tags:
      - Admin Auth
      summary: Staff Forgot Password
      description: Sends an expiring single-use password reset link to the staff member's
        email if an active account exists. Returns the same message regardless of
        whether the email exists.
      operationId: AdminForgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
  /api/v1/admin/auth/reset-password:
    post:
      tags:
      - Admin Auth
      summary: Staff Reset Password
      description: Validates the single-use reset token and password policy, updates
        the password hash, invalidates the token and previous sessions, and logs the
        change.
      operationId: AdminResetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          description: Bad Request
  /api/v1/admin/branches:
    get:
      tags:
      - Admin Branches
      summary: List All Branches
      description: Retrieves all store branches with assigned staff counts and customer
        counts. Supports keyword search and active/inactive status filtering.
      operationId: AdminGetBranches
      parameters:
      - name: search
        in: query
        style: form
        schema:
          type: string
      - name: isActive
        in: query
        style: form
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchDto'
        '401':
          description: Unauthorized
    post:
      tags:
      - Admin Branches
      summary: Create New Branch
      description: Creates a new branch. Branch Code must be unique. Requires Super
        Admin permissions.
      operationId: AdminCreateBranch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDto'
        '400':
          description: Bad Request
        '409':
          description: Conflict
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/admin/branches/{id}:
    get:
      tags:
      - Admin Branches
      summary: Get Branch Details
      description: Retrieves detailed branch information including staff assignments
        and customer statistics.
      operationId: AdminGetBranchById
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDto'
        '404':
          description: Not Found
        '401':
          description: Unauthorized
    put:
      tags:
      - Admin Branches
      summary: Update Branch
      description: Updates store branch details (Name, Address, City, Country, Currency,
        Timezone, Active status). Requires Super Admin permissions.
      operationId: AdminUpdateBranch
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDto'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    delete:
      tags:
      - Admin Branches
      summary: Delete Branch
      description: Deletes a branch that has no assigned customers, staff members,
        or active plans. Requires Super Admin permissions.
      operationId: AdminDeleteBranch
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
        '409':
          description: Conflict
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/admin/branches/{id}/status:
    patch:
      tags:
      - Admin Branches
      summary: Activate or Deactivate Branch
      description: Toggles branch active status. Deactivating the only remaining active
        branch is blocked. Requires Super Admin permissions.
      operationId: AdminUpdateBranchStatus
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchStatusRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDto'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/admin/customers:
    get:
      tags:
      - Admin Customers
      summary: List Customers with Pagination and Filters
      description: Retrieves a paginated list of customers. Supports search by name,
        phone, email, or NIC, as well as filtering by branch and account status. Super
        Admins can access all branches; Branch staff are strictly restricted to their
        assigned branch.
      operationId: AdminGetCustomers
      parameters:
      - name: page
        in: query
        style: form
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        style: form
        schema:
          type: integer
          format: int32
      - name: search
        in: query
        style: form
        schema:
          type: string
      - name: branchId
        in: query
        style: form
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        style: form
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerPagedResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
      - Admin Customers
      summary: Create Customer by Staff
      description: Allows authorized branch staff or Super Admin to create a customer.
        Normalizes inputs, prevents duplicate NICs and contacts, and keeps contacts
        unverified until customer verifies via OTP.
      operationId: AdminCreateCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerDetailDto'
        '400':
          description: Bad Request
        '409':
          description: Conflict
        '403':
          description: Forbidden
  /api/v1/admin/customers/statistics:
    get:
      tags:
      - Admin Customers
      summary: Customer Summary Card Statistics
      description: Calculates customer counts (Total, Active, Inactive) across matching
        branch and search criteria prior to pagination. Status filter is not applied
        so active and inactive counts remain independent.
      operationId: AdminGetCustomerStatistics
      parameters:
      - name: search
        in: query
        style: form
        schema:
          type: string
      - name: branchId
        in: query
        style: form
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerStatisticsDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/admin/customers/metrics:
    get:
      tags:
      - Admin Customers
      summary: Customer and Slot Overview Metrics
      description: Provides aggregated counts for total slots, total customers, active
        investments, closed accounts, inactive accounts, and pending accounts according
        to staff branch permissions.
      operationId: AdminGetCustomerMetrics
      parameters:
      - name: branchId
        in: query
        style: form
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerMetricsDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/admin/customers/{id}:
    get:
      tags:
      - Admin Customers
      summary: Get Detailed Customer Profile
      description: Retrieves detailed profile information for an authorized customer,
        including date of birth, unmasked NIC for authorized staff, verification flags,
        and list of associated Chitu and Jewellery savings slots. Secrets, OTPs, and
        password hashes are never exposed.
      operationId: AdminGetCustomerById
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerDetailDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /api/v1/admin/customers/{id}/status:
    patch:
      tags:
      - Admin Customers
      summary: Activate or Deactivate Customer Account
      description: Enables authorized staff to deactivate or reactivate a customer
        account within permitted branch scope. Deactivation requires a reason and
        immediately revokes all sessions/refresh tokens.
      operationId: AdminUpdateCustomerStatus
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerStatusRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerDetailDto'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /api/v1/admin/jewellery-categories:
    get:
      tags:
      - Admin Jewellery Categories
      summary: List Jewellery Plan Categories
      description: Retrieves a paginated list of jewellery categories. Super Admins
        view across branches or filter by branch; Branch Staff are isolated to their
        assigned branch.
      operationId: AdminGetJewelleryCategories
      parameters:
      - name: search
        in: query
        style: form
        schema:
          type: string
      - name: isActive
        in: query
        style: form
        schema:
          type: boolean
      - name: branchId
        in: query
        style: form
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        style: form
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        style: form
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JewelleryCategoryPagedResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
      - Admin Jewellery Categories
      summary: Create Jewellery Category
      description: Creates a new jewellery plan category (e.g., Gold Bars, Thali Kodi,
        Necklace). Prevents duplicate normalized category names within the same branch.
      operationId: AdminCreateJewelleryCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJewelleryCategoryRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JewelleryCategoryDto'
        '400':
          description: Bad Request
        '409':
          description: Conflict
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/admin/jewellery-categories/{id}:
    get:
      tags:
      - Admin Jewellery Categories
      summary: Get Jewellery Category by ID
      description: Retrieves detailed jewellery category information including associated
        plan counts.
      operationId: AdminGetJewelleryCategoryById
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JewelleryCategoryDto'
        '404':
          description: Not Found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    put:
      tags:
      - Admin Jewellery Categories
      summary: Update Jewellery Category
      description: Updates jewellery category name, description, visual image, and
        active status. Validates normalized name uniqueness.
      operationId: AdminUpdateJewelleryCategory
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJewelleryCategoryRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JewelleryCategoryDto'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '409':
          description: Conflict
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    delete:
      tags:
      - Admin Jewellery Categories
      summary: Delete Jewellery Category
      description: Permanently deletes an unused jewellery category. Rejects deletion
        if plans are associated, directing staff to deactivate instead.
      operationId: AdminDeleteJewelleryCategory
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
        '409':
          description: Conflict
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/admin/jewellery-categories/{id}/status:
    patch:
      tags:
      - Admin Jewellery Categories
      summary: Activate or Deactivate Jewellery Category
      description: Toggles active operational status of a jewellery category. Deactivation
        hides it from new plan creation without affecting existing enrolments or payments.
      operationId: AdminUpdateJewelleryCategoryStatus
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJewelleryCategoryStatusRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JewelleryCategoryDto'
        '404':
          description: Not Found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/admin/jewellery-categories/upload-image:
    post:
      tags:
      - Admin Jewellery Categories
      summary: Upload Category Visual Image
      description: Uploads a category image (PNG, JPG, WEBP, max 2MB) directly to
        Supabase Storage and returns the public CDN URL.
      operationId: AdminUploadJewelleryCategoryImage
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                style: form
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/admin/users:
    get:
      tags:
      - Admin Users
      summary: List Staff Users
      description: Retrieves a list of staff accounts. Super Admins view all staff;
        Branch Admins view staff within their assigned branch. Password hashes are
        never returned.
      operationId: AdminGetUsers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffUserDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags:
      - Admin Users
      summary: Create Staff User
      description: Allows Super Admin to provision a new staff or admin user, assigning
        their role and branch. Validates email, phone, and password policy, and prevents
        duplicates.
      operationId: AdminCreateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffUserRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserDto'
        '400':
          description: Bad Request
        '409':
          description: Conflict
        '403':
          description: Forbidden
  /api/v1/admin/users/{id}/status:
    patch:
      tags:
      - Admin Users
      summary: Activate or Deactivate Staff User
      description: Allows authorized administrators to activate or deactivate a staff
        member. Super Admin can manage all staff and admins (preventing deactivation
        of the last Super Admin). Staff cannot deactivate themselves. Sessions are
        immediately invalidated upon deactivation.
      operationId: AdminUpdateUserStatus
      parameters:
      - name: id
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffStatusRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserDto'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '409':
          description: Conflict
  /api/v1/branches:
    get:
      tags:
      - Branches
      summary: List Active Branches
      description: Retrieves all currently active branches for customer registration,
        store location selection, and mobile lookups.
      operationId: GetBranches
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchDto'
  /api/v1/health:
    get:
      tags:
      - System
      summary: System and database health status
      operationId: HealthCheck
      responses:
        '200':
          description: Success
components:
  schemas:
    AdminCustomerDetailDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        nic:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        isPhoneVerified:
          type: boolean
        isEmailVerified:
          type: boolean
        phoneVerifiedAtUtc:
          type: string
          format: date-time
          nullable: true
        emailVerifiedAtUtc:
          type: string
          format: date-time
          nullable: true
        primaryBranchId:
          type: string
          format: uuid
        primaryBranchName:
          type: string
          nullable: true
        primaryBranchCode:
          type: string
          nullable: true
        isActive:
          type: boolean
        isProfileComplete:
          type: boolean
        createdAtUtc:
          type: string
          format: date-time
        deactivatedAtUtc:
          type: string
          format: date-time
          nullable: true
        deactivationReason:
          type: string
          nullable: true
        closedAtUtc:
          type: string
          format: date-time
          nullable: true
        closureReason:
          type: string
          nullable: true
        chituSlots:
          type: array
          items:
            $ref: '#/components/schemas/AdminCustomerSlotDto'
          nullable: true
        jewelleryEnrolments:
          type: array
          items:
            $ref: '#/components/schemas/AdminCustomerEnrolmentDto'
          nullable: true
      additionalProperties: false
    AdminCustomerEnrolmentDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        planName:
          type: string
          nullable: true
        planCode:
          type: string
          nullable: true
        targetWeightGrams:
          type: number
          format: double
        totalSavedGrams:
          type: number
          format: double
        totalContributedCurrency:
          type: number
          format: double
        status:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
        targetEndDate:
          type: string
          format: date
      additionalProperties: false
    AdminCustomerListItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        nic:
          type: string
          nullable: true
        isPhoneVerified:
          type: boolean
        isEmailVerified:
          type: boolean
        primaryBranchId:
          type: string
          format: uuid
        primaryBranchName:
          type: string
          nullable: true
        primaryBranchCode:
          type: string
          nullable: true
        isActive:
          type: boolean
        isProfileComplete:
          type: boolean
        activePlansCount:
          type: integer
          format: int32
        totalSlotsCount:
          type: integer
          format: int32
        createdAtUtc:
          type: string
          format: date-time
        deactivatedAtUtc:
          type: string
          format: date-time
          nullable: true
        deactivationReason:
          type: string
          nullable: true
        closedAtUtc:
          type: string
          format: date-time
          nullable: true
        closureReason:
          type: string
          nullable: true
      additionalProperties: false
    AdminCustomerMetricsDto:
      type: object
      properties:
        totalSlots:
          type: integer
          format: int32
        totalCustomers:
          type: integer
          format: int32
        activeInvestment:
          type: integer
          format: int32
        closedAccounts:
          type: integer
          format: int32
        inactiveCustomers:
          type: integer
          format: int32
        pendingAccounts:
          type: integer
          format: int32
      additionalProperties: false
    AdminCustomerPagedResponse:
      type: object
      properties:
        items:
          type: array
          items:
