tags:
- name: Branches
  description: Active store locations for customer registration and branch lookups.
- name: Customer Authentication
  description: Customer onboarding, phone & email verification, profile completion,
    session management, and logout.
- name: Customer Chitu Plans
  description: Browse active and available Chitu plans, preview join requirements,
    purchase slots, view My Plans portfolio, and pay for existing slots.
- name: Customer Jewellery Enrolments
  description: Preview and confirm jewellery plan enrolments (My Investments), and
    view contribution history.
- name: Customer Jewellery Plans
  description: Browse active jewellery plan categories and plans available for the
    customer's branch.
- name: Customer Jewellery Quotes & Payments
  description: Gold rate calculation previews, locked payment quotes (Pay Now), and
    deferred payment initiation.
- name: Customer Notifications
  description: Customer notification feed, read receipts, and bulk mark-as-read.
- name: Customer Profile & Contacts
  description: Authenticated customer profile, secondary contact verification, and
    self-service account closure.
- name: Customer Unified Payments
  description: Unified financial transaction history and receipts across both Chitu
    savings plans and Jewellery gold accumulation plans.
- name: System
  description: Health check and database connectivity verification.
