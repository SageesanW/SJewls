openapi: 3.0.1
info:
  title: SJewls Customer Mobile API
  description: Complete API specification for the SJewls Customer Mobile Application
    — Customer Authentication & OTP Verification, Profile Completion, Self-Service
    Account Closure, Active Store Branches, Jewellery Plan & Category Browsing, Plan
    Enrolment Previews & Creation, Contribution Ledger, Gold Rate & Payment Quotes,
    Deferred Payment Initiation, and Customer Notifications.
  version: v1
servers:
- url: http://localhost:5230
  description: Current Host
- url: http://localhost:5230
  description: Local Server
paths:
  /api/v1/branches:
    get:
      tags:
      - Branches
      summary: List Active Branches
      description: Retrieves all currently active branches for customer registration,
        store location selection, and mobile lookups.
      operationId: GetBranches
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchDto'
  /api/v1/auth/check:
    post:
      tags:
      - Customer Authentication
      summary: Check if contact exists in database and determine next step (Login
        or Register)
      description: Verifies the phone number or email address against existing customers
        in the database. Returns whether the customer exists, profile completion state,
        and recommended next action ('Login' or 'Register').
      operationId: CheckContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckContactRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckContactResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/otp/request:
    post:
      tags:
      - Customer Authentication
      summary: Request verification OTP via Phone (Text.lk SMS) or Email (Gmail SMTP)
      description: 'Generates and dispatches a 6-digit verification code to the specified
        contact.


        **Delivery Modes:**

        • **Email Address**: Dispatched via real Gmail SMTP (`smtp.gmail.com:587`,
        STARTTLS) from `w.sagee5@gmail.com` with subject ''Your SJewls verification
        code''. Returns 200 OK only after the SMTP server explicitly accepts the message.
        If delivery fails (e.g., SMTP auth/network failure), the challenge is immediately
        invalidated and a safe 400 error is returned (no fallback to mock).

        • **Phone Number**: Dispatched via real Text.lk SMS Gateway (`https://app.text.lk/api/v3/sms/send`,
        Bearer auth) with sender ID `TextLKDemo`. Returns 200 OK only after the SMS
        gateway accepts delivery. On failure, the challenge is immediately invalidated
        and a safe 400 error is returned.


        **Outcomes & Error Responses:**

        • `200 OK`: Verification code successfully accepted by delivery provider.
        Valid for 5 minutes (resend cooldown 60 seconds).

        • `400 Bad Request`: Active resend cooldown in effect, invalid phone/email
        format, or provider delivery failure.'
      operationId: RequestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOtpResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/otp/verify:
    post:
      tags:
      - Customer Authentication
      summary: Verify submitted OTP code and authenticate or continue registration
      description: 'Verifies the submitted 6-digit OTP against active challenges.


        **Outcomes & Responses:**

        • `200 OK (nextAction: ''Dashboard'')`: Customer exists and profile is complete.
        Returns JWT access token, refresh token, and customer details.

        • `200 OK (nextAction: ''CompleteProfile'')`: Customer is new or profile is
        incomplete. Returns temporary 1-hour `registrationToken`.

        • `400 Bad Request`: Verification code incorrect (attempts decremented, max
        5 allowed), challenge expired (after 5 minutes), or challenge already consumed.

        • `401 Unauthorized`: Customer account is deactivated or closed.'
      operationId: VerifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/registration/complete:
    post:
      tags:
      - Customer Authentication
      summary: Complete customer profile registration
      description: Finalizes customer registration using the registrationToken. Automatically
        preserves the initially entered OTP-verified contact and saves any provided
        secondary email/phone number. Requires FullName, DateOfBirth (18+), and valid
        Sri Lankan NIC. Returns JWT access and refresh tokens.
      operationId: CompleteRegistration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRegistrationRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/token/refresh:
    post:
      tags:
      - Customer Authentication
      summary: Exchange refresh token for a new access token
      description: Rotates the refresh token and returns a new active access token.
      operationId: RefreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/logout:
    post:
      tags:
      - Customer Authentication
      summary: Revoke refresh token and log out
      description: Revokes the specified refresh token, terminating the active mobile
        session.
      operationId: Logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
  /api/v1/customer/chitu-plans:
    get:
      tags:
      - Customer Chitu Plans
      summary: Browse active and available Chitu plans
      description: Retrieves paginated Chitu plans open for joining or late-joining
        in the customer's registered branch.
      operationId: CustomerGetAvailableChituPlans
      parameters:
      - name: page
        in: query
        description: 'Page number (1-based index, default: 1).'
        style: form
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'Number of items per page (default: 20, max: 50).'
        style: form
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituPlansPagedResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/chitu-plans/{planId}:
    get:
      tags:
      - Customer Chitu Plans
      summary: Get Chitu plan details with schedule and terms
      description: Retrieves full details, round schedule, and terms for a specific
        Chitu plan.
      operationId: CustomerGetChituPlanDetails
      parameters:
      - name: planId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituPlanDetailDto'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/chitu-plans/{planId}/join-preview:
    post:
      tags:
      - Customer Chitu Plans
      summary: Preview initial payment for joining a Chitu plan
      description: Calculates required initial payment covering Round 1 (pre-enrolment)
        or all elapsed rounds (late joining) for requested slot quantity.
      operationId: CustomerPreviewChituJoin
      parameters:
      - name: planId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerChituJoinPreviewRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituJoinPreviewResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/chitu-plans/{planId}/join:
    post:
      tags:
      - Customer Chitu Plans
      summary: Confirm and join Chitu plan with slot purchase
      description: Idempotently processes initial payment (or simulated payment in
        test mode) and assigns sequential permanent slots.
      operationId: CustomerConfirmChituJoin
      parameters:
      - name: planId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: Optional client-generated UUID idempotency key to prevent duplicate
          enrolment creations across network retries.
        style: simple
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerChituJoinRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituJoinResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '501':
          description: Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/chitu-investments:
    get:
      tags:
      - Customer Chitu Plans
      summary: Get customer's Chitu portfolio (My Plans)
      description: Returns paginated Chitu plans owned by the customer, grouped by
        plan, with individual slot breakdowns, arrears, and eligibility.
      operationId: CustomerGetChituInvestments
      parameters:
      - name: status
        in: query
        style: form
        schema:
          type: string
      - name: page
        in: query
        description: 'Page number (1-based index, default: 1).'
        style: form
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'Number of items per page (default: 20, max: 50).'
        style: form
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituInvestmentsPagedResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/my-plans:
    get:
      tags:
      - Customer Chitu Plans
      summary: Alias for Customer Chitu investments (My Plans)
      operationId: CustomerGetMyPlansAlias
      parameters:
      - name: status
        in: query
        style: form
        schema:
          type: string
      - name: page
        in: query
        description: 'Page number (1-based index, default: 1).'
        style: form
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'Number of items per page (default: 20, max: 50).'
        style: form
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituInvestmentsPagedResponse'
      security:
      - Bearer: []
  /api/v1/customer/chitu-investments/{planId}:
    get:
      tags:
      - Customer Chitu Plans
      summary: Get single Chitu plan portfolio details
      operationId: CustomerGetChituInvestmentPlanDetails
      parameters:
      - name: planId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituInvestmentPlanDto'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/chitu-slots/{slotId}:
    get:
      tags:
      - Customer Chitu Plans
      summary: Get detailed information for an individual slot
      description: Retrieves slot instalment schedule, payment statuses, arrears,
        and winner entitlement claim data.
      operationId: CustomerGetChituSlotDetails
      parameters:
      - name: slotId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituSlotDetailDto'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/chitu-slots/{slotId}/payments:
    get:
      tags:
      - Customer Chitu Plans
      summary: Get payment history for a specific slot
      operationId: CustomerGetChituSlotPayments
      parameters:
      - name: slotId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerPaymentSummaryDto'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/chitu-plans/{planId}/payable-slots:
    get:
      tags:
      - Customer Chitu Plans
      summary: Get customer's payable slots for a Chitu plan
      description: Returns all slots owned by the customer in this plan with payment
        eligibility, outstanding due, and unpaid rounds.
      operationId: CustomerGetPayableSlots
      parameters:
      - name: planId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPayableSlotsDto'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/chitu-plans/{planId}/payments/preview:
    post:
      tags:
      - Customer Chitu Plans
      summary: Preview payment allocation for existing slots
      description: Calculates per-slot oldest-unpaid-first allocations, resulting
        arrears, and raffle eligibility.
      operationId: CustomerPreviewChituExistingSlotPayment
      parameters:
      - name: planId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerChituPaymentPreviewRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituPaymentPreviewResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/chitu-plans/{planId}/payments:
    post:
      tags:
      - Customer Chitu Plans
      summary: Confirm and post payment for existing slots
      description: Idempotently processes contribution payment, marks instalments
        as Paid, and updates slot coverage.
      operationId: CustomerConfirmChituExistingSlotPayment
      parameters:
      - name: planId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: Optional client-generated UUID idempotency key to prevent duplicate
          enrolment creations across network retries.
        style: simple
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerChituPaymentConfirmRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerChituPaymentConfirmResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '501':
          description: Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/jewellery-enrolments/preview:
    post:
      tags:
      - Customer Jewellery Enrolments
      summary: Preview enrolment confirmation summary
      description: Returns a proposed enrolment confirmation summary containing plan
        snapshot, target grams, premium percentage, proposed joining date and deadline.
      operationId: CustomerPreviewEnrolment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolmentPreviewRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentPreviewResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/jewellery-enrolments:
    post:
      tags:
      - Customer Jewellery Enrolments
      summary: Confirm and join jewellery plan
      description: Creates an active enrolment immediately without requiring an initial
        payment. Idempotent across retries with the same IdempotencyKey. Triggers
        an activation notification. Requires explicit confirmation if the customer
        has previously enrolled in this plan.
      operationId: CustomerCreateEnrolment
      parameters:
      - name: X-Idempotency-Key
        in: header
        description: Optional client-generated UUID idempotency key to prevent duplicate
          enrolment creations across network retries.
        style: simple
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerEnrolmentRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEnrolmentDto'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepeatEnrolmentConflictResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
    get:
      tags:
      - Customer Jewellery Enrolments
      summary: List customer enrolments (My Investments)
      description: Retrieves paginated jewellery plan enrolments for the authenticated
        customer, showing target grams, net accumulated gold, remaining grams, and
        contribution availability.
      operationId: CustomerGetEnrolments
      parameters:
      - name: page
        in: query
        description: 'Page number (1-based index, default: 1).'
        required: true
        style: form
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'Number of items per page (default: 20, max: 50).'
        required: true
        style: form
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEnrolmentsPagedResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/jewellery-enrolments/{enrolmentId}:
    get:
      tags:
      - Customer Jewellery Enrolments
      summary: Get enrolment details
      description: Retrieves full details and progress metrics for a specific enrolment
        owned by the customer.
      operationId: CustomerGetEnrolmentDetails
      parameters:
      - name: enrolmentId
        in: path
        required: true
        style: simple
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEnrolmentDto'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - Bearer: []
  /api/v1/customer/jewellery-enrolments/{enrolmentId}/payments:
    get:
      tags:
      - Customer Jewellery Enrolments
      summary: List enrolment contribution history
      description: Retrieves the confirmed contribution and payment ledger history
        for this jewellery plan enrolment.
      operationId: CustomerGetEnrolmentPayments
      parameters:
      - name: enrolmentId
