components:
  schemas:
    AccountClosureResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
        closedAtUtc:
          type: string
          format: date-time
        status:
          type: string
          nullable: true
      additionalProperties: false
    BenefitStatus:
      enum:
      - Unclaimed
      - Claimed
      type: string
    BranchDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
          nullable: true
        assignedStaffCount:
          type: integer
          format: int32
        customerCount:
          type: integer
          format: int32
      additionalProperties: false
    CheckContactRequest:
      required:
      - contact
      type: object
      properties:
        contact:
          minLength: 1
          type: string
      additionalProperties: false
    CheckContactResponse:
      type: object
      properties:
        exists:
          type: boolean
        isProfileComplete:
          type: boolean
        normalizedContact:
          type: string
          nullable: true
        contactType:
          $ref: '#/components/schemas/ContactType'
        nextAction:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: false
    ChituRedemptionType:
      enum:
      - Cash
      - Gold
      type: string
    ChituSlotStatus:
      enum:
      - PendingReservation
      - Active
      - Won
      - Closed
      - Cancelled
      type: string
    CompleteRegistrationRequest:
      required:
      - dateOfBirth
      - registrationToken
      type: object
      properties:
        registrationToken:
          minLength: 1
          type: string
        fullName:
          maxLength: 100
          minLength: 2
          type: string
          nullable: true
        dateOfBirth:
          type: string
          format: date
        nic:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        additionalContact:
          type: string
          nullable: true
      additionalProperties: false
    ConfirmAccountClosureRequest:
      required:
      - code
      type: object
      properties:
        code:
          maxLength: 6
          minLength: 6
          type: string
        reason:
          type: string
          nullable: true
      additionalProperties: false
    ContactType:
      enum:
      - Phone
      - Email
      type: string
    CreateCustomerEnrolmentRequest:
