  /api/v1/customers/me/contacts/otp/request:
    post:
      tags:
      - Customer Profile & Contacts
      summary: Request OTP to verify secondary profile contact (Email or Phone)
      description: 'Sends a 6-digit OTP to the customer''s unverified secondary contact
        (email or phone).


        **Delivery Modes:**

        • **Email Address**: Dispatched via real Gmail SMTP (`smtp.gmail.com:587`,
        STARTTLS) from `w.sagee5@gmail.com`. Invalidates challenge and returns safe
        400 error on delivery failure.

        • **Phone Number**: Dispatched via real Text.lk SMS Gateway (`https://app.text.lk/api/v3/sms/send`,
        Bearer auth) with sender ID `TextLKDemo`. Invalidates challenge and returns
        safe 400 error on delivery failure.


        **Outcomes & Error Responses:**

        • `200 OK`: Verification code successfully dispatched.

        • `400 Bad Request`: Delivery failure or invalid contact.

        • `404 Not Found`: Customer or pending contact not found.

        • `409 Conflict`: Contact already verified.'
      operationId: RequestSecondaryContactOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestSecondaryContactOtpRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOtpResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
